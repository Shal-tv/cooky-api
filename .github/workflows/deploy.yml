name: Deploy to VPS

on:
    push:
        branches:
            - dev
            - master

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Build API image
                run: |
                    docker build \
                      -f docker/Dockerfile.staging \
                      -t cooky-api:latest .

            -   name: Build Nginx image
                run: |
                    docker build \
                      -f docker/nginx/Dockerfile \
                      -t cooky-nginx:latest .

            -   name: Export images
                run: |
                    docker save cooky-api:latest -o cooky-api.tar
                    docker save cooky-nginx:latest -o cooky-nginx.tar

            -   name: Install SSH key
                run: |
                    mkdir -p ~/.ssh
                    echo "${{ secrets.SERVER_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
                    chmod 600 ~/.ssh/id_rsa
                    
                    ssh-keyscan -p ${{ secrets.SERVER_SSH_PORT }} \
                      ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

            -   name: Upload files
                run: |
                    scp -P ${{ secrets.SERVER_SSH_PORT }} \
                      cooky-api.tar \
                      cooky-nginx.tar \
                      docker/compose.staging.yml \
                      ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/

            -   name: Deploy
                run: |
                    ssh -p ${{ secrets.SERVER_SSH_PORT }} \
                      ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
                    
                    set -e
                    
                    docker load -i /tmp/cooky-api.tar
                    docker load -i /tmp/cooky-nginx.tar
                    
                    docker compose -f /tmp/compose.staging.yml up -d --force-recreate
                    
                    # attendre que PHP-FPM soit prêt
                    sleep 3
                    
                    docker exec cooky-api-staging php bin/console cache:clear --env=prod || true
                    docker exec cooky-api-staging php bin/console cache:warmup --env=prod || true
                    
                    docker image prune -f
                    
                    rm -f /tmp/cooky-api.tar /tmp/cooky-nginx.tar
                    
                    EOF
