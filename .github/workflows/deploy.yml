name: Deploy to VPS

on:
    push:
        branches:
            - dev
            - master

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout code
                uses: actions/checkout@v4

            -   name: Determine environment
                id: env
                run: |
                    if [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
                      echo "ENV=prod" >> $GITHUB_OUTPUT
                    else
                      echo "ENV=staging" >> $GITHUB_OUTPUT
                    fi

            -   name: Set up Docker Buildx
                uses: docker/setup-buildx-action@v3

            -   name: Build Docker image
                run: |
                    docker buildx build --load -f docker/Dockerfile -t cooky-api:latest .

            -   name: Save Docker image
                run: |
                    docker save cooky-api:latest -o /tmp/cooky-api.tar

            -   name: Deploy to VPS
                env:
                    SSH_HOST: ${{ secrets.SERVER_HOST }}
                    SSH_USER: ${{ secrets.SERVER_USER }}
                    SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
                    SSH_KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
                    SSH_PASSPHRASE: ${{ secrets.SERVER_SSH_PASSPHRASE }}
                    DEPLOY_PATH_STAGING: ${{ secrets.SERVER_DEPLOY_PATH_STAGING }}
                    DEPLOY_PATH_PROD: ${{ secrets.SERVER_DEPLOY_PATH_PROD }}
                    ENVIRONMENT: ${{ steps.env.outputs.ENV }}
                run: |
                    sudo apt-get update && sudo apt-get install -y sshpass
                    
                    mkdir -p ~/.ssh
                    echo "$SSH_KEY" > ~/.ssh/id_rsa
                    chmod 600 ~/.ssh/id_rsa
                    
                    ssh-keyscan -p $SSH_PORT -H $SSH_HOST >> ~/.ssh/known_hosts 2>/dev/null || true
                    
                    if [ "$ENVIRONMENT" = "prod" ]; then
                      DEPLOY_PATH=$DEPLOY_PATH_PROD
                    else
                      DEPLOY_PATH=$DEPLOY_PATH_STAGING
                    fi
                    
                    sshpass -p "$SSH_PASSPHRASE" scp -P $SSH_PORT -o StrictHostKeyChecking=no /tmp/cooky-api.tar $SSH_USER@$SSH_HOST:~/cooky-api.tar
                    
                    sshpass -p "$SSH_PASSPHRASE" ssh -p $SSH_PORT -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST << DEPLOY_SCRIPT
                    set -e
                    
                    CONTAINER_NAME="cooky-api-$ENVIRONMENT"
                    
                    docker load -i ~/cooky-api.tar
                    docker stop \$CONTAINER_NAME 2>/dev/null || true
                    docker rm \$CONTAINER_NAME 2>/dev/null || true
                    docker rmi cooky-api:latest 2>/dev/null || true
                    
                    docker run -d \
                      --name \$CONTAINER_NAME \
                      --restart unless-stopped \
                      -v $DEPLOY_PATH:/app \
                      -p 9000:9000 \
                      --env-file $DEPLOY_PATH/.env \
                      cooky-api:latest
                    
                    rm -f ~/cooky-api.tar
                    
                    echo "✅ Deployed to $ENVIRONMENT"
                    DEPLOY_SCRIPT

            -   name: Cleanup
                if: always()
                run: rm -f /tmp/cooky-api.tar
