name: Deploy to VPS

on:
    push:
        branches:
            - dev
            - master

jobs:
    deploy:
        runs-on: ubuntu-latest

        environment:
            name: ${{ github.ref == 'refs/heads/master' && 'prod' || 'staging' }}

        steps:
            -   name: Checkout code
                uses: actions/checkout@v4

            -   name: Determine environment
                id: env
                run: |
                    if [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
                      echo "ENV=prod" >> $GITHUB_OUTPUT
                    else
                      echo "ENV=staging" >> $GITHUB_OUTPUT
                    fi

            -   name: Set up Docker Buildx
                uses: docker/setup-buildx-action@v3

            -   name: Build Docker image
                run: docker buildx build --load --progress=plain -f docker/Dockerfile.staging -t cooky-api:latest .

            -   name: Save Docker image
                run: |
                    mkdir -p /tmp
                    docker save cooky-api:latest -o /tmp/cooky-api.tar

            -   name: Deploy to VPS
                env:
                    SSH_HOST: ${{ secrets.SERVER_HOST }}
                    SSH_USER: ${{ secrets.SERVER_USER }}
                    SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
                    SSH_KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
                    SSH_PASSPHRASE: ${{ secrets.SERVER_SSH_PASSPHRASE }}
                    ENVIRONMENT: ${{ steps.env.outputs.ENV }}
                run: |
                    mkdir -p ~/.ssh
                    echo "$SSH_KEY" > ~/.ssh/id_rsa
                    chmod 600 ~/.ssh/id_rsa
                    
                    eval $(ssh-agent -s)
                    echo "$SSH_PASSPHRASE" | ssh-add ~/.ssh/id_rsa
                    
                    ssh-keyscan -p $SSH_PORT -H $SSH_HOST >> ~/.ssh/known_hosts 2>/dev/null || true
                    
                    scp -P $SSH_PORT -o StrictHostKeyChecking=no \
                      /tmp/cooky-api.tar \
                      docker/compose.staging.yml \
                      $SSH_USER@$SSH_HOST:/tmp/
                    
                    ssh -p $SSH_PORT -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST \
                      ENVIRONMENT="$ENVIRONMENT" \
                      bash -s << 'EOF'
                    set -e
                    
                    CONTAINER_NAME="cooky-api-${ENVIRONMENT}"
                    
                    docker load -i /tmp/cooky-api.tar
                    
                    docker rm -f ${CONTAINER_NAME} 2>/dev/null || true
                    
                    docker compose -f /tmp/compose.staging.yml up -d
                    
                    # HARD FIX: vendor clean reinstall
                    docker exec -u root ${CONTAINER_NAME} rm -rf /var/www/html/vendor
                    
                    docker exec -u www-data ${CONTAINER_NAME} composer install \
                      --no-interaction \
                      --no-dev \
                      --optimize-autoloader \
                      --no-scripts
                    
                    docker exec ${CONTAINER_NAME} php bin/console cache:clear --no-warmup --env=prod || true
                    docker exec ${CONTAINER_NAME} php bin/console cache:warmup --env=prod || true
                    
                    rm -f /tmp/cooky-api.tar /tmp/compose.staging.yml
                    EOF

            -   name: Cleanup
                if: always()
                run: rm -f /tmp/cooky-api.tar
