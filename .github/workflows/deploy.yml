name: Deploy to VPS

on:
    push:
        branches:
            - dev
            - master

jobs:
    deploy:
        runs-on: ubuntu-latest

        environment:
            name: ${{ github.ref == 'refs/heads/master' && 'prod' || 'staging' }}

        steps:

            -   name: Checkout code
                uses: actions/checkout@v4

            -   name: Determine environment
                id: env
                run: |
                    if [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
                      echo "ENV=prod" >> $GITHUB_OUTPUT
                    else
                      echo "ENV=staging" >> $GITHUB_OUTPUT
                    fi

            -   name: Set up Docker Buildx
                uses: docker/setup-buildx-action@v3

            # =========================
            # BUILD PHP IMAGE
            # =========================
            -   name: Build PHP image
                run: |
                    docker build \
                      -f docker/php/Dockerfile \
                      -t cooky-api:${{ steps.env.outputs.ENV }} .

            # =========================
            # BUILD NGINX IMAGE
            # =========================
            -   name: Build Nginx image
                run: |
                    docker build \
                      -f docker/nginx/Dockerfile \
                      -t cooky-nginx:${{ steps.env.outputs.ENV }} .

            # =========================
            # SAVE IMAGES
            # =========================
            -   name: Save Docker images
                run: |
                    mkdir -p /tmp
                    
                    docker save cooky-api:${{ steps.env.outputs.ENV }} -o /tmp/cooky-api.tar
                    docker save cooky-nginx:${{ steps.env.outputs.ENV }} -o /tmp/cooky-nginx.tar

            # =========================
            # DEPLOY TO VPS
            # =========================
            -   name: Deploy to VPS
                env:
                    SSH_HOST: ${{ secrets.SERVER_HOST }}
                    SSH_USER: ${{ secrets.SERVER_USER }}
                    SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
                    SSH_KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
                    SSH_PASSPHRASE: ${{ secrets.SERVER_SSH_PASSPHRASE }}
                run: |
                    mkdir -p ~/.ssh
                    echo "$SSH_KEY" > ~/.ssh/id_rsa
                    chmod 600 ~/.ssh/id_rsa
                    
                    eval $(ssh-agent -s)
                    echo "$SSH_PASSPHRASE" | ssh-add ~/.ssh/id_rsa
                    
                    ssh-keyscan -p $SSH_PORT -H $SSH_HOST >> ~/.ssh/known_hosts 2>/dev/null || true
                    
                    # upload images + compose
                    scp -P $SSH_PORT \
                      /tmp/cooky-api.tar \
                      /tmp/cooky-nginx.tar \
                      docker/compose.staging.yml \
                      $SSH_USER@$SSH_HOST:/tmp/
                    
                    ssh -p $SSH_PORT $SSH_USER@$SSH_HOST << 'EOF'
                    set -e
                    
                    docker load -i /tmp/cooky-api.tar
                    docker load -i /tmp/cooky-nginx.tar
                    
                    docker network create cooky-network 2>/dev/null || true
                    
                    docker compose -f /tmp/compose.staging.yml up -d
                    
                    rm -f /tmp/cooky-api.tar /tmp/cooky-nginx.tar /tmp/compose.staging.yml
                    EOF
