name: Deploy to VPS

on:
    push:
        branches:
            - dev
            - master

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment:
            name: ${{ github.ref == 'refs/heads/master' && 'prod' || 'staging' }}

        steps:
            -   name: Checkout code
                uses: actions/checkout@v4

            -   name: Determine environment
                id: env
                run: |
                    if [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
                      echo "ENV=prod" >> $GITHUB_OUTPUT
                    else
                      echo "ENV=staging" >> $GITHUB_OUTPUT
                    fi

            -   name: Set up Docker Buildx
                uses: docker/setup-buildx-action@v3

            -   name: Build Docker image
                run: docker buildx build --load -f docker/Dockerfile -t cooky-api:latest .

            -   name: Save Docker image
                run: |
                    mkdir -p /tmp
                    docker save cooky-api:latest -o /tmp/cooky-api.tar

            -   name: Deploy to VPS
                env:
                    SSH_HOST: ${{ secrets.SERVER_HOST }}
                    SSH_USER: ${{ secrets.SERVER_USER }}
                    SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
                    SSH_KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
                    SSH_PASSPHRASE: ${{ secrets.SERVER_SSH_PASSPHRASE }}
                    SERVER_DEPLOY_PATH: ${{ secrets.SERVER_DEPLOY_PATH }}
                    ENVIRONMENT: ${{ steps.env.outputs.ENV }}
                run: |
                    mkdir -p ~/.ssh
                    echo "$SSH_KEY" > ~/.ssh/id_rsa
                    chmod 600 ~/.ssh/id_rsa
                    
                    eval $(ssh-agent -s)
                    echo "$SSH_PASSPHRASE" | ssh-add ~/.ssh/id_rsa
                    ssh-keyscan -p $SSH_PORT -H $SSH_HOST >> ~/.ssh/known_hosts 2>/dev/null || true
                    
                    DEPLOY_PATH="/var/www/${SERVER_DEPLOY_PATH}/cooky-api"
                    
                    scp -P $SSH_PORT -o StrictHostKeyChecking=no /tmp/cooky-api.tar $SSH_USER@$SSH_HOST:~/cooky-api.tar
                    
                    ssh -p $SSH_PORT -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST \
                      ENVIRONMENT="$ENVIRONMENT" \
                      DEPLOY_PATH="$DEPLOY_PATH" \
                      bash -s << 'EOF'
                    set -e
                    
                    CONTAINER_NAME="cooky-api-${ENVIRONMENT}"
                    NETWORK_NAME="cooky-network"
                    
                    docker network create ${NETWORK_NAME} 2>/dev/null || true
                    
                    docker load -i ~/cooky-api.tar
                    docker stop ${CONTAINER_NAME} 2>/dev/null || true
                    docker rm -f ${CONTAINER_NAME} 2>/dev/null || true
                    
                    docker run -d \
                      --name ${CONTAINER_NAME} \
                      --network ${NETWORK_NAME} \
                      --restart unless-stopped \
                      -v ${DEPLOY_PATH}:/app \
                      -p 127.0.0.1:9000:9000 \
                      cooky-api:latest
                    
                    rm -f ~/cooky-api.tar
                    EOF

            -   name: Cleanup
                if: always()
                run: rm -f /tmp/cooky-api.tar
