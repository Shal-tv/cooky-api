name: Deploy to VPS

on:
    push:
        branches:
            - dev
            - master

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Determine environment
                id: env
                run: |
                    if [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
                      echo "ENV=prod" >> $GITHUB_OUTPUT
                    else
                      echo "ENV=staging" >> $GITHUB_OUTPUT
                    fi

            -   name: Set up Docker Buildx
                uses: docker/setup-buildx-action@v3

            -   name: Build API image
                run: |
                    docker buildx build --load \
                      -f docker/Dockerfile.staging \
                      -t cooky-api:latest .

            -   name: Build Nginx image
                run: |
                    docker buildx build --load \
                      -f docker/nginx/Dockerfile \
                      -t cooky-nginx:latest .

            -   name: Save Docker images
                run: |
                    mkdir -p /tmp
                    docker save cooky-api:latest -o /tmp/cooky-api.tar
                    docker save cooky-nginx:latest -o /tmp/cooky-nginx.tar

            -   name: Deploy to VPS
                env:
                    SSH_HOST: ${{ secrets.SERVER_HOST }}
                    SSH_USER: ${{ secrets.SERVER_USER }}
                    SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
                    SSH_KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
                    SSH_PASSPHRASE: ${{ secrets.SERVER_SSH_PASSPHRASE }}
                    ENVIRONMENT: ${{ steps.env.outputs.ENV }}
                run: |
                    mkdir -p ~/.ssh
                    echo "$SSH_KEY" > ~/.ssh/id_rsa
                    chmod 600 ~/.ssh/id_rsa
                    
                    eval $(ssh-agent -s)
                    echo "$SSH_PASSPHRASE" | ssh-add ~/.ssh/id_rsa
                    
                    ssh-keyscan -p $SSH_PORT -H $SSH_HOST >> ~/.ssh/known_hosts 2>/dev/null || true
                    
                    scp -P $SSH_PORT \
                      /tmp/cooky-api.tar \
                      /tmp/cooky-nginx.tar \
                      docker/compose.staging.yml \
                      $SSH_USER@$SSH_HOST:/tmp/
                    
                    ssh -p $SSH_PORT $SSH_USER@$SSH_HOST \
                      ENVIRONMENT="$ENVIRONMENT" \
                      bash -s << 'EOF'
                    
                    set -e
                    
                    docker load -i /tmp/cooky-api.tar
                    docker load -i /tmp/cooky-nginx.tar
                    
                    docker compose -f /tmp/compose.staging.yml up -d --force-recreate
                    
                    docker exec cooky-api-staging php bin/console cache:clear --env=prod || true
                    docker exec cooky-api-staging php bin/console cache:warmup --env=prod || true
                    
                    rm -f /tmp/*.tar /tmp/compose.staging.yml
                    
                    EOF

            -   name: Cleanup
                if: always()
                run: rm -f /tmp/cooky-api.tar /tmp/cooky-nginx.tar
