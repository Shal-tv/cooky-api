name: Deploy to VPS

on:
    push:
        branches:
            - dev
            - master

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Determine environment
                id: env
                run: |
                    if [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
                      echo "ENV=prod" >> "$GITHUB_OUTPUT"
                      echo "COMPOSE_FILE=compose.prod.yml" >> "$GITHUB_OUTPUT"
                      echo "COMPOSE_PROJECT=cooky-prod" >> "$GITHUB_OUTPUT"
                      echo "API_CONTAINER=cooky-api-prod" >> "$GITHUB_OUTPUT"
                    else
                      echo "ENV=staging" >> "$GITHUB_OUTPUT"
                      echo "COMPOSE_FILE=compose.staging.yml" >> "$GITHUB_OUTPUT"
                      echo "COMPOSE_PROJECT=cooky-staging" >> "$GITHUB_OUTPUT"
                      echo "API_CONTAINER=cooky-api-staging" >> "$GITHUB_OUTPUT"
                    fi

            -   name: Set up Docker Buildx
                uses: docker/setup-buildx-action@v3

            -   name: Build API image
                run: |
                    docker buildx build --load \
                      -f docker/Dockerfile.staging \
                      -t "cooky-api:${{ steps.env.outputs.ENV }}" .

            -   name: Build Nginx image
                run: |
                    docker buildx build --load \
                      -f docker/nginx/Dockerfile \
                      -t "cooky-nginx:${{ steps.env.outputs.ENV }}" .

            -   name: Save Docker images
                run: |
                    docker save "cooky-api:${{ steps.env.outputs.ENV }}" -o /tmp/cooky-api.tar
                    docker save "cooky-nginx:${{ steps.env.outputs.ENV }}" -o /tmp/cooky-nginx.tar

            -   name: Deploy to VPS
                env:
                    SSH_HOST: ${{ secrets.SERVER_HOST }}
                    SSH_USER: ${{ secrets.SERVER_USER }}
                    SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
                    SSH_KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
                    SSH_PASSPHRASE: ${{ secrets.SERVER_SSH_PASSPHRASE }}
                    ENVIRONMENT: ${{ steps.env.outputs.ENV }}
                    COMPOSE_FILE: ${{ steps.env.outputs.COMPOSE_FILE }}
                    COMPOSE_PROJECT: ${{ steps.env.outputs.COMPOSE_PROJECT }}
                    API_CONTAINER: ${{ steps.env.outputs.API_CONTAINER }}
                    # Full content of config/secrets/{env}/{env}.decrypt.private.php
                    STAGING_DECRYPT_PRIVATE_KEY: ${{ secrets.STAGING_DECRYPT_PRIVATE_KEY }}
                    PROD_DECRYPT_PRIVATE_KEY: ${{ secrets.PROD_DECRYPT_PRIVATE_KEY }}
                run: |
                    mkdir -p ~/.ssh
                    echo "$SSH_KEY" > ~/.ssh/id_rsa
                    chmod 600 ~/.ssh/id_rsa

                    eval "$(ssh-agent -s)"
                    echo "$SSH_PASSPHRASE" | ssh-add ~/.ssh/id_rsa

                    ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

                    if [ "$ENVIRONMENT" = "prod" ]; then
                      printf '%s\n' "$PROD_DECRYPT_PRIVATE_KEY" > /tmp/decrypt.private.php
                    else
                      printf '%s\n' "$STAGING_DECRYPT_PRIVATE_KEY" > /tmp/decrypt.private.php
                    fi

                    scp -P "$SSH_PORT" \
                      /tmp/cooky-api.tar \
                      /tmp/cooky-nginx.tar \
                      /tmp/decrypt.private.php \
                      "docker/${COMPOSE_FILE}" \
                      "${SSH_USER}@${SSH_HOST}:/tmp/"

                    ssh -p "$SSH_PORT" "${SSH_USER}@${SSH_HOST}" \
                      ENVIRONMENT="$ENVIRONMENT" \
                      COMPOSE_FILE="$COMPOSE_FILE" \
                      COMPOSE_PROJECT="$COMPOSE_PROJECT" \
                      API_CONTAINER="$API_CONTAINER" \
                      bash -s << 'EOF'
                    set -e

                    docker load -i /tmp/cooky-api.tar
                    docker load -i /tmp/cooky-nginx.tar

                    docker compose -p "$COMPOSE_PROJECT" -f "/tmp/${COMPOSE_FILE}" up -d --force-recreate --remove-orphans

                    docker cp "/tmp/decrypt.private.php" \
                      "${API_CONTAINER}:/var/www/cooky-api/config/secrets/${ENVIRONMENT}/${ENVIRONMENT}.decrypt.private.php"

                    docker exec "$API_CONTAINER" php bin/console cache:clear --env="$ENVIRONMENT" || true
                    docker exec "$API_CONTAINER" php bin/console cache:warmup --env="$ENVIRONMENT" || true

                    rm -f /tmp/cooky-api.tar /tmp/cooky-nginx.tar /tmp/decrypt.private.php "/tmp/${COMPOSE_FILE}"
                    EOF

            -   name: Cleanup
                if: always()
                run: rm -f /tmp/cooky-api.tar /tmp/cooky-nginx.tar /tmp/decrypt.private.php
