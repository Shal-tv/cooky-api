when@prod:
    doctrine:
        dbal:
            url: postgresql://%env(DB_USER_PROD_RW)%:%env(DB_PASSWORD_PROD_RW)%@%env(DB_HOST_PROD)%:%env(DB_PORT_PROD)%/%env(DB_NAME_PROD)%?serverVersion=13&charset=utf8
        #            connections:
        #                readonly:
        #                    url: postgresql://%env(DB_USER_PROD_RO)%:%env(DB_PASSWORD_PROD_RO)%@%env(DB_HOST_PROD)%:%env(DB_PORT_PROD)%/%env(DB_NAME_PROD)%?serverVersion=13&charset=utf8
        #                readwrite:
        #                    url: postgresql://%env(DB_USER_PROD_RW)%:%env(DB_PASSWORD_PROD_RW)%@%env(DB_HOST_PROD)%:%env(DB_PORT_PROD)%/%env(DB_NAME_PROD)%?serverVersion=13&charset=utf8

        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
