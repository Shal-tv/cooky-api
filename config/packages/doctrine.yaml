doctrine:
    dbal:
        profiling_collect_backtrace: '%kernel.debug%'
        use_savepoints: true

    orm:
        auto_generate_proxy_classes: true
        enable_lazy_ghost_objects: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        mappings:
            App:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Infrastructure/Persistence/Mapping'
                prefix: 'App\Domain\Model'
                alias: App
        filters:
            archive_filter:
                class: App\Infrastructure\Persistence\Filter\ArchiveFilter
                enabled: true

when@test:
    doctrine:
        dbal:
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@dev:
    doctrine:
        dbal:
            url: postgresql://%env(DB_USER_DEV_RW)%:%env(DB_PASSWORD_DEV_RW)%@%env(DB_HOST_DEV)%:%env(DB_PORT_DEV)%/%env(DB_NAME_DEV)%?serverVersion=13&charset=utf8
