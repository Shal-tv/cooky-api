framework:
    messenger:
        default_bus: default.bus

        buses:
            default.bus: ~
            command.bus: ~
            query.bus: ~
            event.bus: ~

when@dev:
    framework:
        messenger:
            transports:
                async:
                    dsn: 'amqp://%env(RMQ_USER_DEV)%:%env(urlencode:RMQ_PASSWORD_DEV)%@%env(RMQ_HOST_DEV)%:%env(RMQ_PORT_DEV)%/%env(urlencode:RMQ_VHOST_DEV)%/messages'
                    failure_transport: async_failed

                async_failed: 'amqp://%env(RMQ_USER_DEV)%:%env(urlencode:RMQ_PASSWORD_DEV)%@%env(RMQ_HOST_DEV)%:%env(RMQ_PORT_DEV)%/%env(urlencode:RMQ_VHOST_DEV)%/messages_failed'

when@staging:
    framework:
        messenger:
            transports:
                async:
                    dsn: 'amqp://%env(RMQ_USER_STAGING)%:%env(urlencode:RMQ_PASSWORD_STAGING)%@%env(RMQ_HOST_STAGING)%:%env(RMQ_PORT_STAGING)%/%env(urlencode:RMQ_VHOST_STAGING)%/messages'
                    failure_transport: async_failed

                async_failed: 'amqp://%env(RMQ_USER_STAGING)%:%env(urlencode:RMQ_PASSWORD_STAGING)%@%env(RMQ_HOST_STAGING)%:%env(RMQ_PORT_STAGING)%/%env(urlencode:RMQ_VHOST_STAGING)%/messages_failed'

