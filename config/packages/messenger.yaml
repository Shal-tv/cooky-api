                async_failed: 'amqp://%env(RMQ_USER_PROD)%:%env(urlencode:RMQ_PASSWORD_PROD)%@%env(RMQ_HOST_PROD)%:%env(RMQ_PORT_PROD)%/%env(urlencode:RMQ_VHOST_PROD)%/messages_failed'
