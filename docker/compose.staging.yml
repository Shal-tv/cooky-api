services:
    api:
        image: cooky-api:latest
        container_name: cooky-api-staging
        restart: unless-stopped
        environment:
            APP_ENV: staging
            APP_DEBUG: 1
        networks:
            - cooky_staging_network
        expose:
            - "9000"

    nginx:
        image: nginx:alpine
        container_name: cooky-nginx-staging
        restart: unless-stopped
        depends_on:
            - api
        ports:
            - "8081:80"
        networks:
            - cooky_staging_network

networks:
    cooky_staging_network:
        driver: bridge
