services:
    api:
        image: ghcr.io/shal-tv/cooky-api:staging
        container_name: cooky-api-staging
        restart: unless-stopped
        environment:
            APP_ENV: staging
            APP_DEBUG: 1
        networks:
            - cooky_staging_network
        expose:
            - "9000"

    nginx:
        image: nginx:alpine
        container_name: cooky-nginx-staging
        restart: unless-stopped
        depends_on:
            - api
        ports:
            - "8081:80"
        volumes:
            - ./nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
        networks:
            - cooky_staging_network

networks:
    cooky_staging_network:
        driver: bridge
