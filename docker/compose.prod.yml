services:
    api:
        image: ${PHP_IMAGE}
        container_name: ${COMPOSE_PROJECT_NAME}-php
        restart: unless-stopped
        extra_hosts:
            - "host.docker.internal:host-gateway"
        ports:
            - "127.0.0.1:${PHP_FPM_PORT}:9000"
        networks:
            - cooky-api

    nginx:
        image: nginx:alpine
        container_name: cooky-api-staging-nginx
        restart: unless-stopped
        depends_on:
            - php
        ports:
            - "127.0.0.1:8080:80"
        volumes:
            - .:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

networks:
    cooky-api:
        name: ${COMPOSE_PROJECT_NAME}
        driver: bridge
