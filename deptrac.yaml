deptrac:
    paths:
        - ./src
    exclude_files:
        - '#.*test.*#'
    layers:
        -   name: Application
            collectors:
                -   type: directory
                    value: src/Application/.*

        -   name: Domain
            collectors:
                -   type: directory
                    value: src/Domain.*

        -   name: Infrastructure
            collectors:
                -   type: directory
                    value: src/Infrastructure.*

        -   name: Presentation
            collectors:
                -   type: directory
                    value: src/Presentation.*

        -   name: Doctrine
            collectors:
                -   type: classLike
                    value: .*Doctrine.*

        -   name: Symfony
            collectors:
                -   type: classLike
                    value: .*Symfony.*

    ruleset:
        Application:
            - Domain
            - Doctrine
            - Symfony

        Domain: [ ]

        Infrastructure:
            - Domain
            - Doctrine
            - Symfony

        Presentation:
            - Application
            - Symfony
